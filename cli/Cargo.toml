[package]
name = "magneto-cli"
version.workspace = true
license.workspace = true
edition = "2024"

# The `magneto` CLI: quick-add and daemon lifecycle. A thin client of
# magneto-core; it spawns and talks to the daemon but never links the engine.

[[bin]]
name = "magneto"
path = "src/main.rs"

[dependencies]
magneto-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
